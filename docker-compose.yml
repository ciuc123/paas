services:
  web:
    build:
      context: ./web
    command: /bin/sh -lc "npm ci && npm run dev -- --hostname 0.0.0.0"
    env_file:
      - ./web/.env.local
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next

  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles:
      - stripe
    depends_on:
      - web
    entrypoint:
      - /bin/sh
      - -lc
    command: >-
      stripe listen
      --api-key "$$STRIPE_SECRET_KEY"
      --forward-to http://web:3000/api/stripe/webhook
      --skip-verify
    env_file:
      - ./web/.env.local
    restart: unless-stopped

volumes:
  web_node_modules:
  web_next: