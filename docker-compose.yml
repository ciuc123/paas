services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paas"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./web
    command: /bin/sh -lc "npm ci && npm run dev -- --hostname 0.0.0.0 -p 3001"
    env_file:
      - ./web/.env.local
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles:
      - stripe
    depends_on:
      - web
    entrypoint:
      - /bin/sh
      - -lc
    command: >-
      stripe listen
      --api-key "$$STRIPE_SECRET_KEY"
      --forward-to http://web:3001/api/stripe/webhook
      --skip-verify
    env_file:
      - ./web/.env.local
    restart: unless-stopped

volumes:
  postgres_data:
  web_node_modules:
  web_next: